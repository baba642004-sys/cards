<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0e">
<meta property="og:title" content="Mohmed abdalla - مترجم">

<title>Mohmed abdalla - مترجم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--l:#f3d98b;--m:#d4af37;--r:212,175,55}
*{box-sizing:border-box;margin:0}
html,body{background:#0a0a0e}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;color:#f5f1e6;min-height:100vh;display:flex;justify-content:center}
a,button{font-family:inherit;text-decoration:none;color:inherit;cursor:pointer}
a:active,button:active{transform:scale(.97)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{position:relative;overflow:hidden;width:100%;max-width:430px;min-height:100vh;padding:20px 20px 40px;display:flex;flex-direction:column;gap:20px}
.g{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(var(--r),.26),transparent 70%)}
.g1{top:-110px;right:-90px;width:320px;height:320px}
.g2{bottom:-130px;left:-110px;width:380px;height:380px;opacity:.6}
header{position:relative;display:flex;align-items:center;justify-content:space-between}
.tag{font-size:14px;font-weight:700;color:var(--m)}
.share{height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;border-radius:22px;border:1px solid rgba(var(--r),.45);background:rgba(255,255,255,.06);color:var(--l);font-size:14px;font-weight:700}
.card{position:relative;padding:32px 20px 24px;border-radius:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,var(--l),var(--m))}
.ring img,.mono{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;object-fit:cover;background:#14130f;color:var(--l);font-size:46px;font-weight:800}
h1{margin-top:6px;font-size:30px;font-weight:800;color:#fff}
.chip{padding:6px 20px;border-radius:20px;border:1px solid rgba(var(--r),.5);background:rgba(var(--r),.1);color:var(--l);font-size:15px;font-weight:700}
.tagline{font-size:16px;line-height:1.7;color:#cdc8b8}
.hr{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--r),.6),transparent)}
.phone{min-height:44px;display:flex;align-items:center;gap:10px;direction:ltr;font-size:20px;letter-spacing:1px}
.phone svg{color:var(--m)}
.save{width:100%;height:60px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--l),var(--m));color:#1a1405;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 28px rgba(var(--r),.35)}
.save svg{stroke-width:2}
.row{width:100%;display:flex;gap:12px}
.btn{flex:1;height:56px;border-radius:16px;color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.wa{border:1px solid rgba(74,222,128,.45);background:rgba(74,222,128,.12)}
.wa svg{color:#4ade80}
.map{border:1px solid rgba(var(--r),.45);background:rgba(var(--r),.1)}
.map svg{color:var(--l)}
.social{display:flex;gap:14px;margin-top:6px}
.social a{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--l);display:flex;align-items:center;justify-content:center}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:24px;background:rgba(20,19,15,.95);border:1px solid rgba(var(--r),.5);color:var(--l);font-size:14px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
</style>
</head>
